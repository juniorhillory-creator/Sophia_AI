
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sophia_postgres
    environment:
      POSTGRES_DB: sophia_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sophia_network

  # ChromaDB Vector Database
  chromadb:
    image: chromadb/chroma:latest
    container_name: sophia_chromadb
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      ALLOW_RESET: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sophia_network

  # Ollama LLM Server
  ollama:
    image: ollama/ollama:latest
    container_name: sophia_ollama
    environment:
      OLLAMA_HOST: 0.0.0.0
      OLLAMA_MODELS: /models
    volumes:
      - ollama_models:/models
    ports:
      - "11434:11434"
    # GPU support (uncomment if GPU available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - sophia_network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sophia_backend
    environment:
      # Database
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/sophia_ai
      # ChromaDB
      CHROMA_PATH: /app/data/chroma
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      # Ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2}
      OLLAMA_TIMEOUT_SECONDS: 120
      # Auth
      JWT_ALGORITHM: RS256
      JWT_PRIVATE_KEY_PATH: /app/keys/private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/public.pem
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      # Google OAuth (optional)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:5173/auth/google/callback}
      # Email (optional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@sophia-ai.local}
      # App
      MAX_UPLOAD_BYTES: 20971520
      CHUNK_SIZE: 1200
      CHUNK_OVERLAP: 150
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174","http://frontend:80"]'
      LOG_LEVEL: INFO
    volumes:
      - backend_data:/app/data
      - ./backend/keys:/app/keys:ro
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - sophia_network
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sophia_frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
    networks:
      - sophia_network
    restart: unless-stopped

volumes:
  postgres_data:
  chromadb_data:
  ollama_models:
  backend_data:

networks:
  sophia_network:
    driver: bridge