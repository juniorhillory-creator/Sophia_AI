[project]
name = "sophia-ai"
version = "0.1.0"
description = "Local research-paper assistant API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "supabase>=2.34",
    "sqlalchemy[asyncio]>=2.0",
    "greenlet>=3.0",
    "asyncpg>=0.29",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.10",
    "cryptography>=42.0",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "alembic>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
